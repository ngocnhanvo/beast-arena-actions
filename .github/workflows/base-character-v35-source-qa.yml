name: Beast Arena - Base V3.5 editable 23 layer native QA (isolated)

on:
  push:
    branches: [ci/base-character-v35-23-layer-qa]
    paths:
      - ".github/workflows/base-character-v35-source-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beast-base-v35-source-only
  cancel-in-progress: false

jobs:
  source-only:
    name: 24 negative tests + official LibreSprite + Godot 4.7.2
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout PUBLIC test utilities
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: pipeline
      - name: Checkout pinned PRIVATE sprite source (transient)
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/beast-arena
          ref: 808d7c9459f5bf1f4a3bb9bf46e4bbba33fee46f
          token: ${{ secrets.BEAST_ARENA_READ_TOKEN }}
          path: private-source
          persist-credentials: false
      - name: Assert immutable PRIVATE source
        run: |
          set -euo pipefail
          test "$(git -C private-source rev-parse HEAD)" = "808d7c9459f5bf1f4a3bb9bf46e4bbba33fee46f"
          test -f private-source/tools/pose_lock/base_character_v34/src/modular_v34.py
          test -f private-source/tools/pose_lock/base_character_v34/assets/original_v33.png
          test -f private-source/tools/pose_lock/base_character_v35/src/pipeline_v35.py
          echo "Pinned exact source; no private PNG assets published"
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned source dependencies
        run: python -m pip install --disable-pip-version-check "Pillow==11.3.0" "numpy==2.2.6"
      - name: Run 24 native source and negative tests
        run: |
          set -euo pipefail
          ROOT="private-source/tools/pose_lock/base_character_v35"
          python -m unittest discover -s "$ROOT/tests" -p 'test_v35.py' -v
      - name: Build 4 original modular variants from 14 parts + 9 gear sources
        run: |
          set -euo pipefail
          ROOT="private-source/tools/pose_lock/base_character_v35"
          python "$ROOT/src/pipeline_v35.py" --output "$RUNNER_TEMP/base-v35"
          python "$ROOT/src/pipeline_v35.py" --output "$RUNNER_TEMP/base-v35" --compose-only
          python "$ROOT/src/qa_v35.py" --root "$RUNNER_TEMP/base-v35"
          python "$ROOT/src/build_preview.py" --source "$RUNNER_TEMP/base-v35" --output "$RUNNER_TEMP/base-v35/preview.html"
      - name: Install official SHA256-pinned LibreSprite v1.3
        run: bash pipeline/ci/setup_libresprite.sh
      - name: Verify all 4 native 23-layer six-frame ASE exports against source
        run: |
          set -euo pipefail
          for SKIN in original skyguard ember hybrid; do
            libresprite -b --sheet-type horizontal "$RUNNER_TEMP/base-v35/skins/$SKIN/$SKIN.aseprite" --sheet "$RUNNER_TEMP/v35-$SKIN.png"
          done
          python - <<'PY'
          import os
          from pathlib import Path
          from PIL import Image
          root=Path(os.environ["RUNNER_TEMP"])
          for name in ("original","skyguard","ember","hybrid"):
              actual=Image.open(root/f"v35-{name}.png").convert("RGBA")
              assert actual.size==(480,80),f"{name}: invalid ASE sheet dimensions"
              for i in range(1,7):
                  expected=Image.open(root/"base-v35"/"skins"/name/f"run_{i:02}.png").convert("RGBA")
                  assert actual.crop(((i-1)*80,0,i*80,80)).tobytes()==expected.tobytes(),f"LIBRESPRITE_PIXEL_DIFF:{name}:{i}"
              print(f"V35_LIBRESPRITE_{name.upper()}_23_LAYER_RGBA_PASS")
          print("V35_ALL_4_NATIVE_SOURCE_EXPORTS_PASS")
          PY
      - name: Setup Godot 4.7.2 for independent sprite input smoke
        run: bash pipeline/ci/setup_godot.sh
      - name: Headless isolated Godot native six-cel AnimatedSprite2D source smoke
        env:
          BEAST_V35_ART_DIR: ${{ runner.temp }}/base-v35
        run: |
          set -euo pipefail
          GODOT_LOG="$RUNNER_TEMP/v35-godot.log"
          godot --headless --path private-source/tools/pose_lock/base_character_v35/godot_source_review --script res://check_source.gd > "$GODOT_LOG" 2>&1 || { cat "$GODOT_LOG"; exit 1; }
          cat "$GODOT_LOG"
          if grep -Eq 'ERROR:|SCRIPT ERROR:|Parser Error' "$GODOT_LOG"; then echo "::error::Godot engine error detected";exit 1;fi
          grep -q 'V35_GODOT_4_7_2_SOURCE_ONLY_PASS_24_CELS' "$GODOT_LOG"
      - name: Report exact scope honestly
        run: |
          {
            echo '### Base Character v3.5 source QA only'
            echo '24 unit tests, four 6-cel 23-layer native LibreSprite strict pixel exports, Godot isolated AnimatedSprite2D source smoke.'
            echo 'Underpaint geometry and six-pose running visuals NOT owner-approved; game integration / Pages / Web browser E2E NOT performed.'
            echo 'No raw PRIVATE sprite or artifacts published to public.'
          } >> "$GITHUB_STEP_SUMMARY"
