name: Beast Arena - Godot CI (public runner)

on:
  push:
    branches: [main]
    paths: [".github/workflows/**", "ci/**", "docs/**", "README.md"]
  schedule:
    - cron: "17 * * * *"  # hourly check; no private-repo Actions minutes
  workflow_dispatch:
    inputs:
      deploy_pages:
        description: "Publish Web game publicly on GitHub Pages (asset/script disclosure)"
        required: true
        default: false
        type: boolean
      publish_public_artifacts:
        description: "Publish compiled builds as PUBLIC artifacts (can expose game data)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: beast-arena-public-ci
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate public CI configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      has_read_token: ${{ steps.token-check.outputs.has_read_token }}
      has_release_token: ${{ steps.token-check.outputs.has_release_token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate scripts
        run: bash ci/validate.sh
      - name: Check source token configured (value never printed)
        id: token-check
        env:
          HAS_READ_TOKEN: ${{ secrets.BEAST_ARENA_READ_TOKEN != '' }}
          HAS_RELEASE_TOKEN: ${{ secrets.BEAST_ARENA_RELEASE_TOKEN != '' }}
        run: |
          echo "has_release_token=$HAS_RELEASE_TOKEN" >> "$GITHUB_OUTPUT"
          if [[ "$HAS_RELEASE_TOKEN" == "true" ]]; then
            echo "Private release credential is configured."
          else
            echo "::notice::Optional BEAST_ARENA_RELEASE_TOKEN is not configured."
          fi
          echo "has_read_token=$HAS_READ_TOKEN" >> "$GITHUB_OUTPUT"
          if [[ "$HAS_READ_TOKEN" == "true" ]]; then
            echo "Private source credential is configured."
          else
            echo "::notice::To build, set BEAST_ARENA_READ_TOKEN in repo Actions secrets."
          fi

  build:
    name: Import, test, export game source
    outputs:
      pages_artifact_ready: ${{ steps.upload_pages.outcome }}
      source_sha: ${{ steps.source-sha.outputs.sha }}
    needs: preflight
    if: (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event_name == 'push') && needs.preflight.outputs.has_read_token == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Require private-source token
        env:
          HAS_READ_TOKEN: ${{ secrets.BEAST_ARENA_READ_TOKEN != '' }}
        run: |
          if [[ "$HAS_READ_TOKEN" != "true" ]]; then
            echo "::error::Missing BEAST_ARENA_READ_TOKEN; see docs/SETUP.md."
            exit 1
          fi
      - name: Checkout PRIVATE game source
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/beast-arena
          ref: main
          token: ${{ secrets.BEAST_ARENA_READ_TOKEN }}
          persist-credentials: false
          path: game
          fetch-depth: 1
      - name: Checkout PUBLIC pipeline scripts
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: pipeline
      - name: Record source commit (SHA only)
        id: source-sha
        shell: bash
        run: |
          SHA="$(git -C game rev-parse HEAD)"
          printf '%s\n' "$SHA" | tee /tmp/beast-arena-commit
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - name: Look up prior successful build (SHA marker only)
        id: built-cache
        if: github.event_name == 'schedule'
        uses: actions/cache/restore@v4
        with:
          path: .ci-success.txt
          key: beast-arena-success-${{ steps.source-sha.outputs.sha }}
      - name: Check successful Pages cache for source SHA
        id: pages-cache
        if: github.event_name == 'schedule'
        uses: actions/cache/restore@v4
        with:
          path: .ci-pages-success.txt
          key: beast-arena-pages-success-${{ steps.source-sha.outputs.sha }}
      - name: Determine whether to rebuild
        id: change-gate
        shell: bash
        env:
          CACHE_HIT: ${{ steps.built-cache.outputs.cache-hit }}
          PAGES_CACHE_HIT: ${{ steps.pages-cache.outputs.cache-hit }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "schedule" && "$CACHE_HIT" == "true" && "$PAGES_CACHE_HIT" == "true" ]]; then
            echo "skip_build=true" >> "$GITHUB_OUTPUT"
            echo "Both compile and Pages deployment succeeded for this source commit."
          else
            echo "skip_build=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Godot 4.7.2 stable
        if: steps.change-gate.outputs.skip_build != 'true'
        shell: bash
        run: bash pipeline/ci/setup_godot.sh
      - name: Import project headlessly
        if: steps.change-gate.outputs.skip_build != 'true'
        run: godot --headless --editor --path game --import --quit
      - name: Test combat rules
        if: steps.change-gate.outputs.skip_build != 'true'
        run: godot --headless --path game --script res://tests/combat_test.gd
      - name: Smoke test arena scene
        if: steps.change-gate.outputs.skip_build != 'true'
        run: godot --headless --path game --script res://tests/smoke_test.gd
      - name: Install export templates
        if: steps.change-gate.outputs.skip_build != 'true'
        shell: bash
        run: bash pipeline/ci/install_templates.sh
      - name: Export Web and Windows
        if: steps.change-gate.outputs.skip_build != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p game/build/web game/build/windows
          godot --headless --path game --export-release "Web" build/web/index.html
          godot --headless --path game --export-release "Windows Desktop" build/windows/BeastArena.exe
          test -s game/build/web/index.html
          test -s game/build/windows/BeastArena.exe
          test -s game/build/windows/BeastArena.pck
          echo "All export checks passed."
      - name: Package compiled exports only
        if: steps.change-gate.outputs.skip_build != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd game/build
          zip -qr "$GITHUB_WORKSPACE/beast-arena-web.zip" web
          zip -qr "$GITHUB_WORKSPACE/beast-arena-windows.zip" windows
      - name: Upload Web game as PUBLIC GitHub Pages artifact (explicit opt-in)
        id: upload_pages
        # Owner explicitly enabled public Pages publishing on 2026-11-25.
        # Auto-deploy on CI-repository pushes; manual runs remain opt-in.
        if: steps.change-gate.outputs.skip_build != 'true' && ((github.event_name == 'workflow_dispatch' && inputs.deploy_pages == true) || github.event_name == 'push' || github.event_name == 'schedule' || vars.AUTO_DEPLOY_PAGES == 'true')
        uses: actions/upload-pages-artifact@v4
        with:
          path: game/build/web
      - name: Upload to PRIVATE repo release (optional)
        if: steps.change-gate.outputs.skip_build != 'true'
        shell: bash
        env:
          PRIVATE_RELEASE_TOKEN: ${{ secrets.BEAST_ARENA_RELEASE_TOKEN }}
          GH_REPO: ngocnhanvo/beast-arena
        run: |
          set -euo pipefail
          if [[ -z "$PRIVATE_RELEASE_TOKEN" ]]; then
            echo "::notice::BEAST_ARENA_RELEASE_TOKEN absent; not storing a private release."
            exit 0
          fi
          echo "::add-mask::$PRIVATE_RELEASE_TOKEN"
          SOURCE_SHA="$(cat /tmp/beast-arena-commit)"
          SHORT_SHA="$(printf '%s' "$SOURCE_SHA" | cut -c1-12)"
          TAG="ci-$SHORT_SHA"
          export GH_TOKEN="$PRIVATE_RELEASE_TOKEN"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$SOURCE_SHA" --title "Beast Arena CI $SHORT_SHA" --notes "Private game source commit $SOURCE_SHA" --prerelease
          fi
          # A source SHA maps to one immutable build. Avoid clobbering assets on
          # repeat CI runs (GitHub sometimes returns HTTP 500 on asset deletion).
          EXISTING_ASSETS="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          if grep -qx 'beast-arena-web.zip' <<< "$EXISTING_ASSETS" && grep -qx 'beast-arena-windows.zip' <<< "$EXISTING_ASSETS"; then
            echo "Private release already contains both ZIP files for this source commit; no upload required."
          else
            UPLOADED=false
            for ATTEMPT in 1 2 3 4; do
              if gh release upload "$TAG" beast-arena-web.zip beast-arena-windows.zip --clobber; then
                UPLOADED=true
                break
              fi
              echo "::warning::Private release upload failed on attempt $ATTEMPT; retrying."
              sleep "$((ATTEMPT * 5))"
            done
            if [[ "$UPLOADED" != "true" ]]; then
              echo "::error::Private release upload failed after 4 attempts."
              exit 1
            fi
            echo "Private release uploaded."
          fi
      - name: Publish PUBLIC binary artifacts (explicit opt-in)
        if: inputs.publish_public_artifacts == true
        uses: actions/upload-artifact@v4
        with:
          name: beast-arena-public-exports
          path: |
            beast-arena-web.zip
            beast-arena-windows.zip
          if-no-files-found: error
          retention-days: 7
      - name: Mark successful scheduled build
        if: steps.change-gate.outputs.skip_build != 'true' && success()
        run: cat /tmp/beast-arena-commit > .ci-success.txt
      - name: Cache successful source commit (SHA only)
        if: steps.change-gate.outputs.skip_build != 'true' && success()
        uses: actions/cache/save@v4
        with:
          path: .ci-success.txt
          key: beast-arena-success-${{ steps.source-sha.outputs.sha }}
      - name: Build summary
        if: always()
        shell: bash
        env:
          PUBLIC_UPLOAD: ${{ inputs.publish_public_artifacts }}
          HAS_PRIVATE_RELEASE_TOKEN: ${{ secrets.BEAST_ARENA_RELEASE_TOKEN != '' }}
        run: |
          echo "## Beast Arena public-runner build" >> "$GITHUB_STEP_SUMMARY"
          echo "Source: private repository ngocnhanvo/beast-arena" >> "$GITHUB_STEP_SUMMARY"
          echo "Public artifacts requested: $PUBLIC_UPLOAD" >> "$GITHUB_STEP_SUMMARY"
          echo "Private release token configured: $HAS_PRIVATE_RELEASE_TOKEN" >> "$GITHUB_STEP_SUMMARY"

  deploy-pages:
    name: Publish Web game to GitHub Pages (PUBLIC)
    needs: [preflight, build]
    if: needs.build.result == 'success' && needs.build.outputs.pages_artifact_ready == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy3.outputs.page_url || steps.deploy4.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy Pages (attempt 1)
        id: deploy1
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Pause before retry 2
        if: steps.deploy1.outcome == 'failure'
        run: sleep 20
      - name: Deploy Pages (attempt 2)
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Pause before retry 3
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 40
      - name: Deploy Pages (attempt 3)
        id: deploy3
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Pause before retry 4
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure' && steps.deploy3.outcome == 'failure'
        run: sleep 60
      - name: Deploy Pages (attempt 4)
        id: deploy4
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure' && steps.deploy3.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Confirm Pages deployment completed
        if: always()
        env:
          OUTCOME_1: ${{ steps.deploy1.outcome }}
          OUTCOME_2: ${{ steps.deploy2.outcome }}
          OUTCOME_3: ${{ steps.deploy3.outcome }}
          OUTCOME_4: ${{ steps.deploy4.outcome }}
        run: |
          if [[ "$OUTCOME_1" == "success" || "$OUTCOME_2" == "success" || "$OUTCOME_3" == "success" || "$OUTCOME_4" == "success" ]]; then
            echo "GitHub Pages deployment succeeded."
          else
            echo "::error::GitHub Pages deployment failed on all 4 attempts (previously API HTTP 500)."
            exit 1
          fi
      - name: Record successful Pages source commit
        if: success()
        shell: bash
        env:
          SHA: ${{ needs.build.outputs.source_sha }}
        run: |
          test -n "$SHA"
          printf '%s\n' "$SHA" > .ci-pages-success.txt
      - name: Store successful Pages source SHA (no source files)
        if: success()
        uses: actions/cache/save@v4
        with:
          path: .ci-pages-success.txt
          key: beast-arena-pages-success-${{ needs.build.outputs.source_sha }}
