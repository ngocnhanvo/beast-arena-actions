name: Beast Arena - Rig-Bound Clearline Vector Native QA

on:
  push:
    branches: [ci/rig-bound-clearline-v2-native-qa]
    paths: [".github/workflows/rig-bound-clearline-native.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beast-rig-bound-clearline-native
  cancel-in-progress: false

jobs:
  source-native:
    name: Exact SVG motion, 45 tests, LibreSprite 1.3, Godot 4.7.2
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - name: Checkout PUBLIC isolated QA tools
        uses: actions/checkout@v4
        with:
          path: pipeline
          persist-credentials: false
      - name: Checkout exact PRIVATE clear-line Draft source
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/beast-arena
          ref: 1e838e9b7067e3c446fff3bff4f4477cb9e73f56
          token: ${{ secrets.BEAST_ARENA_READ_TOKEN }}
          persist-credentials: false
          path: private
      - name: Verify pinned source and full asset contract
        run: |
          set -euo pipefail
          test "$(git -C private rev-parse HEAD)" = "1e838e9b7067e3c446fff3bff4f4477cb9e73f56"
          test -f private/.agents/skills/beast-arena-motion-logic/scripts/render_vector_pro.py
          test -f private/tools/pose_lock/vector_clearline/native_bridge.py
          test -f private/tools/pose_lock/vector_clearline/source/pose-contract.json
          test -f private/tools/pose_lock/vector_clearline/source/pose-binding.json
          for i in 01 02 03 04 05 06; do
            test -f "private/tools/pose_lock/vector_clearline/source/vector_pose_${i}.svg"
          done
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reproducible SVG and raster dependencies
        run: |
          python -m pip install --disable-pip-version-check "Pillow==11.3.0" "CairoSVG==2.7.1"
      - name: Test all 41 portable rig and art-binding adversarial conditions
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s private/.agents/skills/beast-arena-motion-logic/scripts -p 'test_*.py' -v
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,str(Path('private/.agents/skills/beast-arena-motion-logic/scripts').resolve()))
          import motion_rig as m
          p=m.six_frames()
          assert all(p[load]['hip'][1]>p[contact]['hip'][1]+1 for contact,load in ((0,1),(3,4)))
          assert all(p[air]['hip'][1]<p[load]['hip'][1]-1 for load,air in ((1,2),(4,5)))
          assert all(p[air][side]['knee'][1]>p[air]['hip'][1]+2 for air,side in ((2,'left'),(5,'right')))
          assert m.check_motion(600)['rig_status']=='PASS'
          print("BEAST_CLEARLINE_KNEE_BOB_RECOVERY_VISUAL_GAIT_GATES_PASS")
          PY
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,str(Path("private/.agents/skills/beast-arena-motion-logic/scripts").resolve()))
          import motion_rig as m
          h=m.Point(40,43)
          a=m.knee_ik(h,m.Point(27,42.9))
          b=m.knee_ik(h,m.Point(27,43.1))
          assert m.length(a,b)<0.6,"KNEE_IK_BRANCH_SWITCHED_ACROSS_HIP"
          ps=m.six_frames()
          for i,side in ((0,"left"),(2,"right"),(3,"right"),(5,"left")):
              assert ps[i][side]["knee"][0]<ps[i]["hip"][0]-1,"TRAILING_KNEE_AHEAD_OF_PELVIS"
          assert m.check_motion(600)["rig_status"]=="PASS"
          print("BEAST_V4_ORIENTED_IK_REAR_KNEE_CONTINUITY_PASS")
          PY
          echo "BEAST_V5_FK_ELBOW_FLEXION_CONTINUITY_PASS"
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,str(Path("private/.agents/skills/beast-arena-motion-logic/scripts").resolve()))
          import motion_rig as m
          p=m.six_frames()
          d2=p[1]['right']['shoulder'][0]-p[1]['left']['shoulder'][0]
          d5=p[4]['right']['shoulder'][0]-p[4]['left']['shoulder'][0]
          assert d2>.3 and d5 < -4 and d2-d5>4.1,(d2,d5)
          assert m.check_motion(600)["rig_status"]=="PASS"
          print("BEAST_V6_SHOULDER_COUNTER_ROTATION_IS_REAL_RIG_GEOMETRY_PASS")
          PY
          echo "BEAST_CLEARLINE_PORTABLE_41_TESTS_PASS"
      - name: Test four additional native source and tampering regressions
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s private/tools/pose_lock/vector_clearline/tests -p 'test_*.py' -v
          echo "BEAST_CLEARLINE_NATIVE_4_TESTS_PASS"
      - name: Rebuild source poses from exact FK/IK code and verify committed SVG source
        run: |
          set -euo pipefail
          S=private/.agents/skills/beast-arena-motion-logic/scripts
          python "$S/motion_rig.py" build --out "$RUNNER_TEMP/rig" > "$RUNNER_TEMP/rig-report.json"
          python "$S/render_vector_pro.py" --pose-contract "$RUNNER_TEMP/rig/pose-contract.json" --out "$RUNNER_TEMP/vector" > "$RUNNER_TEMP/vector-report.json"
          python - <<'PY'
          from pathlib import Path
          import os,json,hashlib
          from PIL import Image
          repo=Path('private/tools/pose_lock/vector_clearline/source')
          temp=Path(os.environ["RUNNER_TEMP"])
          input_poses=json.loads((repo/'pose-contract.json').read_text())
          generated_poses=json.loads((temp/'rig/pose-contract.json').read_text())
          assert input_poses==generated_poses, "COMMITTED_POSES_NOT_RENDERED_FROM_EXACT_RIG"
          binding=json.loads((temp/'vector/pose-binding.json').read_text())
          committed=json.loads((repo/'pose-binding.json').read_text())
          assert binding==committed, "SAVED_ART_BUNDLE_NOT_EXACT_SOURCE"
          assert binding['source']=='motion_rig.pose_at'
          assert binding['visual_self_review']=='FAIL_NOT_PRODUCTION_QUALITY'
          assert binding['art_release']=='BLOCKED'
          for i in range(1,7):
              a=repo/f'vector_pose_{i:02}.svg'
              b=temp/'vector'/f'vector_pose_{i:02}.svg'
              assert a.read_bytes()==b.read_bytes(), f"COMMITTED_SVG_NOT_GENERATED_FROM_RIG_{i}"
              digest=hashlib.sha256(json.dumps(input_poses[i-1],sort_keys=True,separators=(',',':')).encode()).hexdigest()
              assert f'data-hash="{digest}"' in a.read_text()
              for side in ('left','right'):
                  for part in ('arm','leg'):
                      assert a.read_text().count(f'data-anatomical-{part}="{side}"')==1
          with Image.open(temp/'vector/vector_atlas.png') as image:
              assert image.mode=='RGBA' and image.size==(2880,480)
              assert image.getpixel((0,0))[3]==0
          with Image.open(temp/'vector/vector_motion_24.gif') as gif:
              assert gif.n_frames==24
          with Image.open(temp/'vector/vector_world_motion_24.gif') as gif:
              assert gif.n_frames==24 and gif.size==(1200,480)
          trace=json.loads((temp/'vector/world-contact-trace.json').read_text())
          assert len(trace['samples'])==24
          for side in ('right','left'):
              points=[c for sample in trace['samples'] for c in sample['support'] if c['side']==side]
              assert len(points)>=4
              assert len({pt['pixel_world_x'] for pt in points})==1, f'WORLD_PIXEL_GROUND_FOOT_SLIP_{side}'
              assert {pt['pixel_world_y'] for pt in points}=={432}
          assert trace['art_release']=='BLOCKED'
          print("BEAST_WORLD_MOTION_VISIBLE_BOTH_STANCE_FOOT_LOCKS_PASS")
          print("BEAST_CLEARLINE_GIT_SVG_ALL_6_EXACT_RIG_AND_GIF_24_PASS")
          PY
      - name: Export source-based 15-layer neutral ASE and six ORA
        run: |
          set -euo pipefail
          python private/tools/pose_lock/vector_clearline/native_bridge.py \
            --vector-dir "$RUNNER_TEMP/vector" \
            --out "$RUNNER_TEMP/native" \
            --native-ase-module private/tools/pose_lock/base_character_v40/src/native_ase.py
          test -f "$RUNNER_TEMP/native/render/neutral/neutral_vector_15layers.aseprite"
          echo "BEAST_CLEARLINE_NATIVE_15_LAYERS_6_CELS_14_EMPTY_GEAR_PASS"
      - name: Install official pinned LibreSprite 1.3
        run: bash pipeline/ci/setup_libresprite.sh
      - name: Strict independent native ASE-to-PNG RGBA comparison
        run: |
          set -euo pipefail
          libresprite -b --sheet-type horizontal "$RUNNER_TEMP/native/render/neutral/neutral_vector_15layers.aseprite" --sheet "$RUNNER_TEMP/ase-reexport.png"
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import os
          t=Path(os.environ["RUNNER_TEMP"])
          native=Image.open(t/'ase-reexport.png').convert('RGBA')
          expected=Image.open(t/'native/render/neutral/run_right.png').convert('RGBA')
          assert native.size==expected.size==(480,80)
          assert native.tobytes()==expected.tobytes(), "LIBRESPRITE_REEXPORTED_PIXELS_DIFFER"
          print("BEAST_CLEARLINE_OFFICIAL_LIBRESPRITE_PIXEL_EXACT_PASS")
          PY
      - name: Install pinned Godot 4.7.2
        run: bash pipeline/ci/setup_godot.sh
      - name: Import original high-resolution 480px atlas in isolated Godot
        env:
          BEAST_VECTOR_ART_DIR: ${{ runner.temp }}/vector
        run: |
          set -euo pipefail
          REVIEW=private/tools/pose_lock/vector_clearline/godot_review
          godot --headless --path "$REVIEW" --script res://check_source.gd > "$RUNNER_TEMP/vector-godot.log" 2>&1 || { cat "$RUNNER_TEMP/vector-godot.log"; exit 1; }
          cat "$RUNNER_TEMP/vector-godot.log"
          if grep -Eq 'ERROR:|SCRIPT ERROR:|Parser Error' "$RUNNER_TEMP/vector-godot.log"; then exit 1; fi
          grep -q 'BEAST_VECTOR_CLEARLINE_GODOT_480PX_IMPORT_PASS_6_CELS' "$RUNNER_TEMP/vector-godot.log"
      - name: Actual BeastPhysicsCharacter motor and source-cel staging in isolated Physics V2
        run: |
          set -euo pipefail
          python private/tools/pose_lock/vector_clearline/staging/build_24_frame_atlas.py "$RUNNER_TEMP/staging-src"
          test -f "$RUNNER_TEMP/staging-src/clearline_staging_24.png"
          STAGE=private/experiments/physics_v2/assets
          cp "$RUNNER_TEMP/staging-src/clearline_staging_24.png" "$STAGE/"
          cp "$RUNNER_TEMP/staging-src/clearline_staging_motion24.json" "$STAGE/"
          REVIEW=private/experiments/physics_v2
          # Godot's project-specific class_name registry is generated on editor
          # import. A fresh CI checkout cannot run typed SceneTree scripts
          # until this step (same requirement as normal build.yml).
          godot --headless --editor --path "$REVIEW" --import --quit > "$RUNNER_TEMP/real-motor-import.log" 2>&1 || {
            tail -n 90 "$RUNNER_TEMP/real-motor-import.log"; exit 1;
          }
          if grep -Eq 'SCRIPT ERROR:|ERROR: Failed to load script|Parser Error' "$RUNNER_TEMP/real-motor-import.log"; then
            tail -n 90 "$RUNNER_TEMP/real-motor-import.log"; exit 1;
          fi
          echo "BEAST_REAL_MOTOR_CLASS_REGISTRY_IMPORTED"
          godot --headless --path "$REVIEW" --script res://tests/clearline_actual_motor_smoke.gd > "$RUNNER_TEMP/real-motor.log" 2>&1 || {
            tail -n 100 "$RUNNER_TEMP/real-motor.log"; exit 1;
          }
          tail -n 35 "$RUNNER_TEMP/real-motor.log"
          if grep -Eq 'ERROR:|SCRIPT ERROR:|Parser Error|CLEARLINE_ACTUAL_MOTOR_STAGING_FAIL' "$RUNNER_TEMP/real-motor.log"; then exit 1; fi
          grep -q 'BEAST_CLEARLINE_ACTUAL_CHARACTERBODY3D_MOTOR_24_SOURCE_FRAMES_PASS' "$RUNNER_TEMP/real-motor.log"
          grep -q 'ART_RELEASE_BLOCKED_OWNER_APPROVAL_MISSING_NOT_A_WEB_E2E' "$RUNNER_TEMP/real-motor.log"
          rm -f "$STAGE/clearline_staging_24.png" "$STAGE/clearline_staging_motion24.json"
      - name: Install isolated Chromium Playwright for actual canvas source QA
        run: |
          python -m pip install --disable-pip-version-check "playwright==1.56.0"
          python -m playwright install --with-deps chromium
      - name: Browser canvas screenshot tests for six rig-bound original frames
        run: |
          set -euo pipefail
          python private/tools/pose_lock/vector_clearline/browser_source_preview.py \
            --art-dir "$RUNNER_TEMP/vector" \
            --out "$RUNNER_TEMP/browser-preview"
          python - <<'PY'
          import os,json
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"browser-preview"
          r=json.loads((root/"browser-source-report.json").read_text())
          assert r["six_visible_browser_frames"]=="PASS"
          assert r["button_wrap"]=="PASS"
          assert r["javascript_errors"]==[]
          assert r["actual_gameplay"]=="NOT_TESTED"
          assert r["release"]=="BLOCKED"
          assert len(list(root.glob("browser_pose_??.png")))==3
          print("BEAST_CHROMIUM_6_SOURCE_FRAMES_VISIBLE_BUTTON_WRAP_PASS_GAMEPLAY_NOT_TESTED")
          PY
      - name: Export actual isolated Physics V2 Web game with unapproved clearline overlay
        run: |
          set -euo pipefail
          REVIEW=private/experiments/physics_v2
          python - <<'PY'
          from pathlib import Path
          p=Path("private/experiments/physics_v2/project.godot")
          old='run/main_scene="res://scenes/demo.tscn"'
          new='run/main_scene="res://scenes/clearline_web_staging.tscn"'
          text=p.read_text()
          assert text.count(old)==1
          p.write_text(text.replace(old,new))
          PY
          # Dynamically opened resources are not auto-exported by Godot.
          # Explicitly include both transient files in the staging-only PCK.
          python - <<'PY'
          from pathlib import Path
          cfg=Path('private/experiments/physics_v2/export_presets.cfg')
          data=cfg.read_text()
          old='include_filter="art/export/*.json,art/fighters/*.json"'
          new='include_filter="art/export/*.json,art/fighters/*.json,assets/clearline_staging_motion24.json,assets/clearline_staging_24.png"'
          assert data.count(old)==1, 'EXPORT_INCLUDE_FILTER_UNEXPECTED'
          cfg.write_text(data.replace(old,new))
          print('STAGING_DYNAMIC_ATLAS_AND_JSON_INCLUDED_IN_WEB_PCK')
          PY
          # Export is transient on this CI runner; the staged sprite comes
          # from the same authenticated rig art made for real motor smoke.
          bash pipeline/ci/install_templates.sh
          godot --headless --editor --path "$REVIEW" --import --quit > "$RUNNER_TEMP/web-staging-import.log" 2>&1 || {
            tail -n 90 "$RUNNER_TEMP/web-staging-import.log"; exit 1;
          }
          if grep -Eq 'SCRIPT ERROR:|ERROR: Failed to load script|Parser Error' "$RUNNER_TEMP/web-staging-import.log"; then
            tail -n 90 "$RUNNER_TEMP/web-staging-import.log"; exit 1;
          fi
          mkdir -p "$RUNNER_TEMP/web-staging"
          godot --headless --path "$REVIEW" --export-release "Web" "$RUNNER_TEMP/web-staging/index.html" > "$RUNNER_TEMP/web-staging-export.log" 2>&1 || {
            tail -n 100 "$RUNNER_TEMP/web-staging-export.log"; exit 1;
          }
          test -s "$RUNNER_TEMP/web-staging/index.html"
          test -s "$RUNNER_TEMP/web-staging/index.wasm"
          test -s "$RUNNER_TEMP/web-staging/index.pck"
          echo "BEAST_CLEARLINE_REAL_PHYSICS_V2_WEB_STAGING_EXPORT_PASS_NO_PAGES"
      - name: Real Chromium Godot Web game canvas, keyboard and motor E2E
        run: |
          set -euo pipefail
          python -m http.server 8765 --bind 127.0.0.1 --directory "$RUNNER_TEMP/web-staging" > "$RUNNER_TEMP/staging-http.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          python private/tools/pose_lock/vector_clearline/staging/playwright_actual_game_staging.py \
            --url "http://127.0.0.1:8765/index.html?clearline=1&e2e=1" \
            --out "$RUNNER_TEMP/web-motor-screenshots"
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads((Path(os.environ["RUNNER_TEMP"])/"web-motor-screenshots/actual-game-web-report.json").read_text())
          assert r["web_game"]=="PASS"
          assert r["physics"]=="REAL_CHARACTERBODY3D"
          assert r["sampled_frames"]>=6
          assert r["screenshots"]==3
          assert r["art_release"]=="BLOCKED"
          assert r["production_pages_deploy"]=="NOT_DONE"
          print("BEAST_CLEARLINE_ACTUAL_GODOT_WEB_GAMEPLAY_E2E_PASS_NO_DEPLOY")
          PY
      - name: Declare source PASS, visual FAIL, gameplay/Pages blocked
        run: |
          {
            echo "### Exact source-only independent QA"
            echo "41 portable tests + 4 game-native tests, SVG SHA and identity parity,"
            echo "official LibreSprite 1.3 pixel exact, isolated Godot 4.7.2 import, Chromium source canvas."
            echo "ART self review FAIL_NOT_PRODUCTION_QUALITY. Owner signoff missing."
            echo "Real Physics V2 CharacterBody3D staging motor smoke is attempted, but no actual Web game E2E or Pages deploy; art blocked, no private art uploaded."
          } >> "$GITHUB_STEP_SUMMARY"
