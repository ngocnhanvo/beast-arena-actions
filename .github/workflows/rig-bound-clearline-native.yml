name: Beast Arena - Rig-Bound Clearline Vector Native QA

on:
  push:
    branches: [ci/rig-bound-clearline-v2-native-qa]
    paths: [".github/workflows/rig-bound-clearline-native.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beast-rig-bound-clearline-native
  cancel-in-progress: false

jobs:
  source-native:
    name: Exact SVG motion, 93 tests, native/editor/Godot Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - name: Checkout PUBLIC isolated QA tools
        uses: actions/checkout@v4
        with:
          path: pipeline
          persist-credentials: false
      - name: Checkout exact PRIVATE clear-line Draft source
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/beast-arena
          ref: 02790675f1511b2500a0d26a27f58baca18d133d
          token: ${{ secrets.BEAST_ARENA_READ_TOKEN }}
          persist-credentials: false
          path: private
      - name: Verify pinned source and full asset contract
        run: |
          set -euo pipefail
          test "$(git -C private rev-parse HEAD)" = "02790675f1511b2500a0d26a27f58baca18d133d"
          test -f private/.agents/skills/beast-arena-motion-logic/scripts/render_vector_pro.py
          test -f private/tools/pose_lock/vector_clearline/native_bridge.py
          test -f private/tools/pose_lock/vector_clearline/source/pose-contract.json
          test -f private/tools/pose_lock/vector_clearline/source/pose-binding.json
          for i in 01 02 03 04 05 06; do
            test -f "private/tools/pose_lock/vector_clearline/source/vector_pose_${i}.svg"
          done
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reproducible SVG and raster dependencies
        run: |
          python -m pip install --disable-pip-version-check "Pillow==11.3.0" "CairoSVG==2.7.1"
      - name: Test 56 portable rig and art-binding cases
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s private/.agents/skills/beast-arena-motion-logic/scripts -p 'test_*.py' -v
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,str(Path('private/.agents/skills/beast-arena-motion-logic/scripts').resolve()))
          import motion_rig as m
          p=m.six_frames()
          assert all(p[load]['hip'][1]>p[contact]['hip'][1]+1 for contact,load in ((0,1),(3,4)))
          assert all(p[air]['hip'][1]<p[load]['hip'][1]-1 for load,air in ((1,2),(4,5)))
          assert all(p[air][side]['knee'][1]>p[air]['hip'][1]+2 for air,side in ((2,'left'),(5,'right')))
          assert m.check_motion(600)['rig_status']=='PASS'
          print("BEAST_CLEARLINE_KNEE_BOB_RECOVERY_VISUAL_GAIT_GATES_PASS")
          PY
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,str(Path("private/.agents/skills/beast-arena-motion-logic/scripts").resolve()))
          import motion_rig as m
          h=m.Point(40,43)
          a=m.knee_ik(h,m.Point(27,42.9))
          b=m.knee_ik(h,m.Point(27,43.1))
          assert m.length(a,b)<0.6,"KNEE_IK_BRANCH_SWITCHED_ACROSS_HIP"
          ps=m.six_frames()
          for i,side in ((0,"left"),(2,"right"),(3,"right"),(5,"left")):
              assert ps[i][side]["knee"][0]<ps[i]["hip"][0]-1,"TRAILING_KNEE_AHEAD_OF_PELVIS"
          assert m.check_motion(600)["rig_status"]=="PASS"
          print("BEAST_V4_ORIENTED_IK_REAR_KNEE_CONTINUITY_PASS")
          PY
          echo "BEAST_V5_FK_ELBOW_FLEXION_CONTINUITY_PASS"
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,str(Path("private/.agents/skills/beast-arena-motion-logic/scripts").resolve()))
          import motion_rig as m
          p=m.six_frames()
          d2=p[1]['right']['shoulder'][0]-p[1]['left']['shoulder'][0]
          d5=p[4]['right']['shoulder'][0]-p[4]['left']['shoulder'][0]
          assert d2>.3 and d5 < -4 and d2-d5>4.1,(d2,d5)
          assert m.check_motion(600)["rig_status"]=="PASS"
          print("BEAST_V6_SHOULDER_COUNTER_ROTATION_IS_REAL_RIG_GEOMETRY_PASS")
          PY
          echo "BEAST_CLEARLINE_PORTABLE_56_TESTS_PASS"
      - name: B1 owner visual signoff is NOT B2 skin binding - 5 fail closed controls
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python private/tools/pose_lock/approved_b1/test_b2_reference_gate.py -v
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          src=Path("private/tools/pose_lock/approved_b1/b2_reference_gate.py")
          spec=importlib.util.spec_from_file_location("b2gate",src)
          mod=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          assert mod.APPROVED_B1_SIZE==(1774,887)
          assert mod.APPROVED_B1_SHA256=="579784d916f5e2c6869061c945261c57bfa33d0f78c93a37af79340957f775c9"
          # Approved asset is PRIVATE to conversation; no PNG in PUBLIC runner.
          # The 5 synthetic controls MUST NOT be claimed as visual B2 PASS.
          print("BEAST_B1_OWNER_VISUAL_APPROVAL_BOUNDARY_5_TESTS_PASS_B2_ART_REMAINS_BLOCKED")
          PY
      - name: Test 4 native regressions plus 5 independent screenshot-negative controls
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s private/tools/pose_lock/vector_clearline/tests -p 'test_*.py' -v
          echo "BEAST_CLEARLINE_NATIVE_AND_SCREENSHOT_9_TESTS_PASS"
      - name: Rebuild source poses from exact FK/IK code and verify committed SVG source
        run: |
          set -euo pipefail
          S=private/.agents/skills/beast-arena-motion-logic/scripts
          python "$S/motion_rig.py" build --out "$RUNNER_TEMP/rig" > "$RUNNER_TEMP/rig-report.json"
          python "$S/render_vector_pro.py" --pose-contract "$RUNNER_TEMP/rig/pose-contract.json" --out "$RUNNER_TEMP/vector" > "$RUNNER_TEMP/vector-report.json"
          python - <<'PY'
          from pathlib import Path
          import os,json,hashlib
          from PIL import Image
          repo=Path('private/tools/pose_lock/vector_clearline/source')
          temp=Path(os.environ["RUNNER_TEMP"])
          input_poses=json.loads((repo/'pose-contract.json').read_text())
          generated_poses=json.loads((temp/'rig/pose-contract.json').read_text())
          assert input_poses==generated_poses, "COMMITTED_POSES_NOT_RENDERED_FROM_EXACT_RIG"
          binding=json.loads((temp/'vector/pose-binding.json').read_text())
          committed=json.loads((repo/'pose-binding.json').read_text())
          assert binding==committed, "SAVED_ART_BUNDLE_NOT_EXACT_SOURCE"
          assert binding['source']=='motion_rig.pose_at'
          assert binding['visual_self_review']=='FAIL_NOT_PRODUCTION_QUALITY'
          assert binding['art_release']=='BLOCKED'
          for i in range(1,7):
              a=repo/f'vector_pose_{i:02}.svg'
              b=temp/'vector'/f'vector_pose_{i:02}.svg'
              assert a.read_bytes()==b.read_bytes(), f"COMMITTED_SVG_NOT_GENERATED_FROM_RIG_{i}"
              digest=hashlib.sha256(json.dumps(input_poses[i-1],sort_keys=True,separators=(',',':')).encode()).hexdigest()
              assert f'data-hash="{digest}"' in a.read_text()
              for side in ('left','right'):
                  for part in ('arm','leg'):
                      assert a.read_text().count(f'data-anatomical-{part}="{side}"')==1
          with Image.open(temp/'vector/vector_atlas.png') as image:
              assert image.mode=='RGBA' and image.size==(2880,480)
              assert image.getpixel((0,0))[3]==0
          with Image.open(temp/'vector/vector_motion_24.gif') as gif:
              assert gif.n_frames==24
          with Image.open(temp/'vector/vector_world_motion_24.gif') as gif:
              assert gif.n_frames==24 and gif.size==(1200,480)
          trace=json.loads((temp/'vector/world-contact-trace.json').read_text())
          assert len(trace['samples'])==24
          for side in ('right','left'):
              points=[c for sample in trace['samples'] for c in sample['support'] if c['side']==side]
              assert len(points)>=4
              assert len({pt['pixel_world_x'] for pt in points})==1, f'WORLD_PIXEL_GROUND_FOOT_SLIP_{side}'
              assert {pt['pixel_world_y'] for pt in points}=={432}
          assert trace['art_release']=='BLOCKED'
          print("BEAST_WORLD_MOTION_VISIBLE_BOTH_STANCE_FOOT_LOCKS_PASS")
          print("BEAST_CLEARLINE_GIT_SVG_ALL_6_EXACT_RIG_AND_GIF_24_PASS")
          PY
      - name: Isolated organic FK-IK silhouette art study (no production asset replacement)
        run: |
          set -euo pipefail
          S=private/.agents/skills/beast-arena-motion-logic/scripts
          python "$S/render_organic_v7_candidate.py" --out "$RUNNER_TEMP/organic-v7"
          python - <<'PY'
          import json,os,hashlib
          from pathlib import Path
          from PIL import Image
          t=Path(os.environ["RUNNER_TEMP"])/"organic-v7"
          trace=json.loads((t/"organic_trace.json").read_text())
          assert trace["source"]=="motion_rig.pose_at"
          assert trace["reused_rig_keyframes"]==6
          assert trace["original_authored_frames"]==0
          assert trace["timing_samples"]==24
          assert len(trace["samples"])==24
          assert trace["release"]=="BLOCKED"
          for i in range(1,7):
            s=(t/f"organic_pose_{i:02}.svg").read_text()
            assert 'data-source="motion_rig.pose_at"' in s
            for side in ('left','right'):
              for part in ('arm','leg'):
                assert s.count(f'data-anatomical-{part}="{side}"')==1
            with Image.open(t/f"organic_pose_{i:02}.png") as im:
              assert im.size==(480,480) and im.mode=="RGBA"
          with Image.open(t/"organic_contact.png") as im:
            assert im.size==(1470,1060)
          with Image.open(t/"organic_motion_24.gif") as im:
            assert im.n_frames==24
          print("BEAST_ORGANIC_V7_RIG_BOUND_STUDY_6_SVG_24_SAMPLES_PASS_ART_BLOCKED")
          PY
          # Do NOT upload any PRIVATE generated source/Pixels to public artifacts/logs.

      - name: Isolated v8 continuous organic knees and elbows visual-source proof
        run: |
          set -euo pipefail
          S=private/.agents/skills/beast-arena-motion-logic/scripts
          python "$S/render_organic_v8_candidate.py" --out "$RUNNER_TEMP/organic-v8"
          python - <<'PY'
          import json,os,hashlib,sys
          from pathlib import Path
          from PIL import Image,ImageChops
          t=Path(os.environ["RUNNER_TEMP"])
          study=json.loads((t/"organic-v8/organic_v8_trace.json").read_text())
          assert study['schema']=='beast-arena/rig-organic-knee-study-2'
          assert study['source']=='motion_rig.pose_at'
          assert study['timing_samples']==24
          assert study['original_authored_frames']==0 and study['reused_rig_keyframes']==6
          assert study['release']=='BLOCKED'
          sys.path.insert(0,str(Path("private/.agents/skills/beast-arena-motion-logic/scripts").resolve()))
          import motion_rig as m
          for i,p in enumerate(m.six_frames(),1):
              svg=(t/f"organic-v8/organic_v8_pose_{i:02}.svg").read_text()
              digest=hashlib.sha256(json.dumps(p,sort_keys=True,separators=(',',':')).encode()).hexdigest()
              assert f'data-hash="{digest}"' in svg
              assert svg.count('<circle data-joint=')==14
              for side in ('left','right'):
                  assert svg.count(f'data-anatomical-leg="{side}"')==1
                  assert svg.count(f'data-anatomical-arm="{side}"')==1
                  for j in ('hip','knee','ankle','toe','shoulder','elbow','hand'):
                      assert f'data-joint="{j}" data-side="{side}"' in svg
              with Image.open(t/f"organic-v8/organic_v8_pose_{i:02}.png") as b:
                  assert b.size==(480,480) and b.mode=='RGBA'
                  with Image.open(t/f"organic-v7/organic_pose_{i:02}.png") as a:
                      assert ImageChops.difference(a.convert('RGB'),b.convert('RGB')).getbbox(),f'NO_NEW_ARTWORK_FRAME_{i}'
          with Image.open(t/"organic-v8/organic_v8_contact.png") as c:
              assert c.size==(1470,1060)
          with Image.open(t/"organic-v8/organic_v8_motion_24.gif") as c:
              assert c.n_frames==24
          print("BEAST_ORGANIC_V8_EXACT_RIG_SHA_14_JOINTS_6_CHANGED_SVG_AND_24_SAMPLES_PASS_ART_BLOCKED")
          PY
          # PRIVATE artwork remains solely on transient isolated runner; no upload.

      - name: Experimental v9 folded recovery rig and six-vector source study
        run: |
          set -euo pipefail
          S=private/.agents/skills/beast-arena-motion-logic/scripts
          python "$S/render_organic_v9_candidate.py" --out "$RUNNER_TEMP/organic-v9"
          python - <<'PY'
          import sys,json,os,hashlib
          from pathlib import Path
          from PIL import Image,ImageChops
          t=Path(os.environ["RUNNER_TEMP"])
          sys.path.insert(0,str(Path("private/.agents/skills/beast-arena-motion-logic/scripts").resolve()))
          import motion_rig as base
          import motion_organic_v9 as gait
          assert gait.check_motion(600)["rig_status"]=="PASS"
          f=gait.six_frames()
          assert base.validate_keyframes(f)==[]
          for k in (2,5):
            q=f[k]['right' if k==2 else 'left']
            assert q['knee'][1]-q['ankle'][1] > abs(q['knee'][0]-q['ankle'][0])*1.45
          manifest=json.loads((t/"organic-v9/v9_study.json").read_text())
          assert manifest['art_release']=='BLOCKED' and manifest['original_art_cels']==0
          assert manifest['derived_animation_samples']==24
          for i,p in enumerate(f,1):
            svg=(t/"organic-v9"/f"v9_pose_{i:02}.svg").read_text()
            digest=hashlib.sha256(json.dumps(p,sort_keys=True,separators=(',',':')).encode()).hexdigest()
            assert f'data-hash="{digest}"' in svg
            assert svg.count("<circle data-joint=")==14
            with Image.open(t/"organic-v9"/f"v9_pose_{i:02}.png") as image:
              assert image.mode=="RGBA" and image.size==(480,480)
          with Image.open(t/"organic-v9/v9_motion_24.gif") as gif:
            assert gif.n_frames==24
          print("BEAST_ORGANIC_V9_FOLDED_RECOVERY_600_DENSE_SAMPLES_6_SVG_24_GIF_PASS_ART_BLOCKED")
          PY

      - name: Eight independently art-directed key-pose source proofs (not eight painted cels)
        run: |
          set -euo pipefail
          S=private/.agents/skills/beast-arena-motion-logic/scripts
          PYTHONDONTWRITEBYTECODE=1 python "$S/v10_art_qa.py"
          python "$S/render_organic_v10_keys.py" --out "$RUNNER_TEMP/organic-v10"
          python - <<'PY'
          from pathlib import Path
          import os,json,hashlib
          from PIL import Image
          t=Path(os.environ["RUNNER_TEMP"])/"organic-v10"
          d=json.loads((t/"v10_manifest.json").read_text())
          assert d["source_key_pose_count"]==8
          assert d["independent_art_direction_records"]==8
          assert d["independently_painted_finished_cels"]==0
          assert d["derived_24_timing_frames"]==24
          assert d["art_release"]=="BLOCKED"
          assert len({json.dumps(x["art_direction"],sort_keys=True) for x in d["keys"]})==8
          for i in range(1,9):
              svg=(t/f"v10_key_{i:02}.svg").read_text()
              assert '<metadata id="author-surface" data-art-hash="' in svg
              assert svg.count("<circle data-joint=")==14
              for side in ("left","right"):
                  for role in ("arm","leg"):
                      assert svg.count(f'data-anatomical-{role}="{side}"')==1
              with Image.open(t/f"v10_key_{i:02}.png") as image:
                  assert image.mode=="RGBA" and image.size==(480,480)
          with Image.open(t/"v10_motion_24.gif") as gif:
              assert gif.n_frames==24
          print("BEAST_V10_EIGHT_ART_DIRECTED_KEYS_8_SVG_24_SAMPLES_RIG_BOUND_PASS_NOT_PAINTED")
          PY
          # No source SVG/PNG/GIF are uploaded to PUBLIC GitHub artifacts or Pages.

      - name: Experimental 2.5D depth punch 3-axis IK and fail-closed art proof
        run: |
          set -euo pipefail
          P=private/tools/pose_lock/punch25d
          PYTHONDONTWRITEBYTECODE=1 python "$P/test_punch25d.py" -v
          python "$P/punch25d.py" --out "$RUNNER_TEMP/punch25d-proof" > "$RUNNER_TEMP/punch25d-cli.log"
          python - <<'PY'
          import json,os
          from pathlib import Path
          from PIL import Image
          t=Path(os.environ["RUNNER_TEMP"])/"punch25d-proof"
          d=json.loads((t/"punch25d_report.json").read_text())
          assert d["source"]=="true-3d-two-bone-ik-per-arm"
          assert d["owner_b1_style_reference_sha"]=="579784d916f5e2c6869061c945261c57bfa33d0f78c93a37af79340957f775c9"
          assert d["punch_axis_world"]=="X+Z with positive Z toward viewer"
          assert d["pose_samples"]==21 and d["preview_keys"]==3
          assert d["projection_fist_magnification"]>1.20
          assert d["right_wrist_z"][1]>d["right_wrist_z"][0]+50
          assert d["right_wrist_z"][0]==d["right_wrist_z"][2]
          assert not d["identical_approved_b1_pixels_used"]
          assert not d["approved_b1_layered_master_available"]
          assert d["b2_art_acceptance"]=="PENDING_OWNER" and d["art_release"]=="BLOCKED"
          assert d["godot_game_integration"]=="NOT_RUN"
          for i in range(1,4):
              svg=(t/f"punch25d_pose_{i:02}.svg").read_text()
              assert 'data-origin="2.5D_3D_FK_IK"' in svg
              assert 'data-art-gate="B2_PROTOTYPE_NOT_OWNER_APPROVED"' in svg
              with Image.open(t/f"punch25d_pose_{i:02}.png") as im:
                  assert im.mode=="RGBA" and im.size==(480,480)
                  assert im.getpixel((0,0))[3]==0
          with Image.open(t/"punch25d_21frames.gif") as im:
              assert im.n_frames==21
          with Image.open(t/"punch25d_game_80px.png") as im:
              assert im.size==(240,96)
          print("BEAST_PUNCH_25D_THREE_AXES_3D_IK_10_TESTS_PASS_VISUAL_UNAPPROVED_NO_DEPLOY")
          PY
          # Keep all PRIVATE derived SVG/PNG/GIF local to transient runner.
          # This test does NOT prove exact owner-approved pixels are skinned.
      - name: Independent 2.5D B1-inspired keyed corrective anchoring (8 tests, no private art)
        run: |
          set -euo pipefail
          P=private/tools/pose_lock/punch25d
          PYTHONDONTWRITEBYTECODE=1 python "$P/test_keyed_corrective_rig.py" -v
          python "$P/keyed_corrective_rig.py"
          python - <<'PY'
          import importlib.util,sys
          from pathlib import Path
          s=Path("private/tools/pose_lock/punch25d").resolve()
          sys.path.insert(0,str(s))
          import keyed_corrective_rig as rig
          result=rig.dense_motion_check(600)
          assert result["samples"]==601
          assert result["art_keys"]==2
          assert result["art_release"]=="BLOCKED"
          assert result["owner_B2_approval"]=="NOT_GIVEN"
          assert result["gameplay_integration"]=="NOT_RUN"
          assert rig.CORRECTIVE_SOURCE_SHA256=="1637041c655e0d2fe6425493fb1f058f0d9abc7cb910e8c37a2dd700af5e656c"
          print("BEAST_KEYED_25D_PUNCH_8_SOURCE_TESTS_PASS_OWNER_ART_UNAPPROVED")
          PY
          # No approved B1 pixels or unapproved corrective art pixels in PUBLIC logs.
      - name: Export source-based 15-layer neutral ASE and six ORA
        run: |
          set -euo pipefail
          python private/tools/pose_lock/vector_clearline/native_bridge.py \
            --vector-dir "$RUNNER_TEMP/vector" \
            --out "$RUNNER_TEMP/native" \
            --native-ase-module private/tools/pose_lock/base_character_v40/src/native_ase.py
          test -f "$RUNNER_TEMP/native/render/neutral/neutral_vector_15layers.aseprite"
          echo "BEAST_CLEARLINE_NATIVE_15_LAYERS_6_CELS_14_EMPTY_GEAR_PASS"
      - name: Install official pinned LibreSprite 1.3
        run: bash pipeline/ci/setup_libresprite.sh
      - name: Strict independent native ASE-to-PNG RGBA comparison
        run: |
          set -euo pipefail
          libresprite -b --sheet-type horizontal "$RUNNER_TEMP/native/render/neutral/neutral_vector_15layers.aseprite" --sheet "$RUNNER_TEMP/ase-reexport.png"
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import os
          t=Path(os.environ["RUNNER_TEMP"])
          native=Image.open(t/'ase-reexport.png').convert('RGBA')
          expected=Image.open(t/'native/render/neutral/run_right.png').convert('RGBA')
          assert native.size==expected.size==(480,80)
          assert native.tobytes()==expected.tobytes(), "LIBRESPRITE_REEXPORTED_PIXELS_DIFFER"
          print("BEAST_CLEARLINE_OFFICIAL_LIBRESPRITE_PIXEL_EXACT_PASS")
          PY
      - name: Install pinned Godot 4.7.2
        run: bash pipeline/ci/setup_godot.sh
      - name: Import original high-resolution 480px atlas in isolated Godot
        env:
          BEAST_VECTOR_ART_DIR: ${{ runner.temp }}/vector
        run: |
          set -euo pipefail
          REVIEW=private/tools/pose_lock/vector_clearline/godot_review
          godot --headless --path "$REVIEW" --script res://check_source.gd > "$RUNNER_TEMP/vector-godot.log" 2>&1 || { cat "$RUNNER_TEMP/vector-godot.log"; exit 1; }
          cat "$RUNNER_TEMP/vector-godot.log"
          if grep -Eq 'ERROR:|SCRIPT ERROR:|Parser Error' "$RUNNER_TEMP/vector-godot.log"; then exit 1; fi
          grep -q 'BEAST_VECTOR_CLEARLINE_GODOT_480PX_IMPORT_PASS_6_CELS' "$RUNNER_TEMP/vector-godot.log"
      - name: Actual BeastPhysicsCharacter motor and source-cel staging in isolated Physics V2
        run: |
          set -euo pipefail
          python private/tools/pose_lock/vector_clearline/staging/build_24_frame_atlas.py "$RUNNER_TEMP/staging-src"
          test -f "$RUNNER_TEMP/staging-src/clearline_staging_24.png"
          STAGE=private/experiments/physics_v2/assets
          cp "$RUNNER_TEMP/staging-src/clearline_staging_24.png" "$STAGE/"
          cp "$RUNNER_TEMP/staging-src/clearline_staging_motion24.json" "$STAGE/"
          REVIEW=private/experiments/physics_v2
          # Godot's project-specific class_name registry is generated on editor
          # import. A fresh CI checkout cannot run typed SceneTree scripts
          # until this step (same requirement as normal build.yml).
          godot --headless --editor --path "$REVIEW" --import --quit > "$RUNNER_TEMP/real-motor-import.log" 2>&1 || {
            tail -n 90 "$RUNNER_TEMP/real-motor-import.log"; exit 1;
          }
          if grep -Eq 'SCRIPT ERROR:|ERROR: Failed to load script|Parser Error' "$RUNNER_TEMP/real-motor-import.log"; then
            tail -n 90 "$RUNNER_TEMP/real-motor-import.log"; exit 1;
          fi
          echo "BEAST_REAL_MOTOR_CLASS_REGISTRY_IMPORTED"
          godot --headless --path "$REVIEW" --script res://tests/clearline_actual_motor_smoke.gd > "$RUNNER_TEMP/real-motor.log" 2>&1 || {
            tail -n 100 "$RUNNER_TEMP/real-motor.log"; exit 1;
          }
          tail -n 35 "$RUNNER_TEMP/real-motor.log"
          if grep -Eq 'ERROR:|SCRIPT ERROR:|Parser Error|CLEARLINE_ACTUAL_MOTOR_STAGING_FAIL' "$RUNNER_TEMP/real-motor.log"; then exit 1; fi
          grep -q 'BEAST_CLEARLINE_ACTUAL_CHARACTERBODY3D_MOTOR_24_SOURCE_FRAMES_PASS' "$RUNNER_TEMP/real-motor.log"
          grep -q 'ART_RELEASE_BLOCKED_OWNER_APPROVAL_MISSING_NOT_A_WEB_E2E' "$RUNNER_TEMP/real-motor.log"
