          # transient input assets. Rebuild them before Web export, rather
          # than depending on leftover files in runner state.
          python private/tools/pose_lock/vector_clearline/staging/build_24_frame_atlas.py "$RUNNER_TEMP/web-art-source" --art-style organic-v10
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          from PIL import Image,ImageChops
          p=Path(os.environ["RUNNER_TEMP"])
          v8=p/"web-art-source"
          doc=json.loads((v8/"clearline_staging_motion24.json").read_text())
          assert doc["art_style"]=="organic-v10-eight-key-study"
          assert doc["authored_original_cels"]==6 and len(doc["frames"])==24
          assert doc["owner_visual_acceptance"]=="NOT_GIVEN"
          assert doc["art_release"]=="BLOCKED"
          assert doc["atlas_png_sha256"]==hashlib.sha256((v8/"clearline_staging_24.png").read_bytes()).hexdigest()
          with Image.open(v8/"clearline_staging_24.png") as a, Image.open(p/"staging-src/clearline_staging_24.png") as b:
            assert a.size==b.size==(2880,1920)
            assert a.mode==b.mode=="RGBA"
            assert ImageChops.difference(a.convert("RGB"),b.convert("RGB")).getbbox(), "WEB_V8_ATLAS_IS_STILL_V6"
            assert a.getpixel((0,0))[3]==0
          print("BEAST_V10_ACTUAL_WEB_ATLAS_EXACT_SOURCE_SHA_AND_PIXELS_DIFFER_FROM_V6_PASS")
          PY
          cp "$RUNNER_TEMP/web-art-source/clearline_staging_24.png" "$REVIEW/assets/"
          cp "$RUNNER_TEMP/web-art-source/clearline_staging_motion24.json" "$REVIEW/assets/"
          test -s "$REVIEW/assets/clearline_staging_24.png"
          test -s "$REVIEW/assets/clearline_staging_motion24.json"
          python - <<'PY'
          from pathlib import Path
          p=Path("private/experiments/physics_v2/project.godot")
          old='run/main_scene="res://scenes/demo.tscn"'
          new='run/main_scene="res://scenes/clearline_web_staging.tscn"'
          text=p.read_text()
          assert text.count(old)==1
          p.write_text(text.replace(old,new))
          PY
          # Dynamically opened resources are not auto-exported by Godot.
          # Explicitly include both transient files in the staging-only PCK.
          python - <<'PY'
          from pathlib import Path
          cfg=Path('private/experiments/physics_v2/export_presets.cfg')
          data=cfg.read_text()
          old='include_filter="art/export/*.json,art/fighters/*.json"'
          new='include_filter="art/export/*.json,art/fighters/*.json,assets/clearline_staging_motion24.json,assets/clearline_staging_24.png"'
          assert data.count(old)==1, 'EXPORT_INCLUDE_FILTER_UNEXPECTED'
          cfg.write_text(data.replace(old,new))
          print('STAGING_DYNAMIC_ATLAS_AND_JSON_INCLUDED_IN_WEB_PCK')
          PY
          # Godot Web imports PNG as Texture2D and excludes raw JSON from PCK.
          # Bake the exact verified motion JSON and preloaded source Texture2D
          # only into this ephemeral runner's staging scene, never PRIVATE Git.
          python - <<'PY'
          from pathlib import Path
          import base64,json,hashlib
          source=Path('private/experiments/physics_v2/assets/clearline_staging_motion24.json')
          raw=source.read_bytes()
          doc=json.loads(raw)
          assert doc['source']=='motion_rig.pose_at' and doc['art_release']=='BLOCKED'
          assert len(doc['frames'])==24 and doc['authored_original_cels']==6
          assert doc['art_style']=='organic-v10-eight-key-study'
          assert doc['gait_profile']=='folded-recovery-v9'
          assert doc['surface_direction_keys']==8
          assert doc['independently_painted_finished_cels']==0
          assert len(doc['atlas_png_sha256'])==64 and doc['owner_visual_acceptance']=='NOT_GIVEN'
          script=Path('private/experiments/physics_v2/scripts/clearline_web_staging.gd')
          data=script.read_text()
          old_json='const CLEARLINE_MOTION_BASE64: String = "STAGING_MOTION_CONTRACT_NOT_EMBEDDED"'
          new_json='const CLEARLINE_MOTION_BASE64: String = "'+base64.b64encode(raw).decode('ascii')+'"'
          old_png='const CLEARLINE_WEB_TEXTURE: Texture2D = null'
          new_png='const CLEARLINE_WEB_TEXTURE: Texture2D = preload("res://assets/clearline_staging_24.png")'
          assert data.count(old_json)==1 and data.count(old_png)==1
          script.write_text(data.replace(old_json,new_json).replace(old_png,new_png))
          print('BEAST_WEB_STAGING_EXACT_SOURCE_EMBEDDED_'+hashlib.sha256(raw).hexdigest()[:12])
          PY
          # Export is transient on this CI runner; the staged sprite comes
          # from the same authenticated rig art made for real motor smoke.
          bash pipeline/ci/install_templates.sh
          godot --headless --editor --path "$REVIEW" --import --quit > "$RUNNER_TEMP/web-staging-import.log" 2>&1 || {
            tail -n 90 "$RUNNER_TEMP/web-staging-import.log"; exit 1;
          }
          if grep -Eq 'SCRIPT ERROR:|ERROR: Failed to load script|Parser Error' "$RUNNER_TEMP/web-staging-import.log"; then
            tail -n 90 "$RUNNER_TEMP/web-staging-import.log"; exit 1;
          fi
          mkdir -p "$RUNNER_TEMP/web-staging"
          godot --headless --path "$REVIEW" --export-release "Web" "$RUNNER_TEMP/web-staging/index.html" > "$RUNNER_TEMP/web-staging-export.log" 2>&1 || {
            tail -n 100 "$RUNNER_TEMP/web-staging-export.log"; exit 1;
          }
          test -s "$RUNNER_TEMP/web-staging/index.html"
          test -s "$RUNNER_TEMP/web-staging/index.wasm"
          test -s "$RUNNER_TEMP/web-staging/index.pck"
          echo "BEAST_CLEARLINE_REAL_PHYSICS_V2_WEB_STAGING_EXPORT_PASS_NO_PAGES"
