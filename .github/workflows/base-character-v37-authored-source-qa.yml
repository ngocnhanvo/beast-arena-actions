name: Beast Arena - Base v3.7 authored 84-layer retouch QA (isolated)

on:
  push:
    branches: [ci/base-character-v37-authored-source-qa]
    paths: [".github/workflows/base-character-v37-authored-source-qa.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beast-v37-source-qa
  cancel-in-progress: false

jobs:
  verify:
    name: 84 scoped art tasks + 20 tests + native LibreSprite + Godot
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout PUBLIC CI utilities
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: pipeline
      - name: Checkout immutable PRIVATE source transiently
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/beast-arena
          ref: 273171a16850f3044240e66ee91647c806692a1f
          token: ${{ secrets.BEAST_ARENA_READ_TOKEN }}
          persist-credentials: false
          path: private-source
      - name: Verify exact PRIVATE source pin
        run: |
          set -euo pipefail
          test "$(git -C private-source rev-parse HEAD)" = "273171a16850f3044240e66ee91647c806692a1f"
          test -f private-source/tools/pose_lock/base_character_v37/assets/v37_skyguard_ember_84_layers.zip
          test -f private-source/tools/pose_lock/base_character_v34/assets/original_v33.png
          echo 'Private source SHA pinned; never upload private art or secrets to PUBLIC artifacts'
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check "Pillow==11.3.0" "numpy==2.2.6"
      - name: Produce ORIGINAL v3.5 authoring source and v3.6 contract
        run: |
          set -euo pipefail
          R="private-source/tools/pose_lock"
          python "$R/base_character_v35/src/pipeline_v35.py" --output "$RUNNER_TEMP/v37"
          python "$R/base_character_v35/src/qa_v35.py" --root "$RUNNER_TEMP/v37"
          python "$R/base_character_v36/src/sprite_contract.py" bootstrap --root "$RUNNER_TEMP/v37" > "$RUNNER_TEMP/contract.json"
      - name: Verify SHA-pinned 84 edits and apply through one-slot agent protocol
        run: |
          set -euo pipefail
          R="private-source/tools/pose_lock"
          python "$R/base_character_v37/src/apply_art_pack.py" \
            --root "$RUNNER_TEMP/v37" \
            --pack "$R/base_character_v37/assets/v37_skyguard_ember_84_layers.zip" \
            --output "$RUNNER_TEMP/v37-receipts" --check-only
          python "$R/base_character_v37/src/apply_art_pack.py" \
            --root "$RUNNER_TEMP/v37" \
            --pack "$R/base_character_v37/assets/v37_skyguard_ember_84_layers.zip" \
            --output "$RUNNER_TEMP/v37-receipts"
      - name: Rebuild actual 4 skins from individually authored source, do not regenerate edits
        run: |
          set -euo pipefail
          R="private-source/tools/pose_lock"
          python "$R/base_character_v35/src/pipeline_v35.py" --output "$RUNNER_TEMP/v37" --compose-only
          python "$R/base_character_v35/src/qa_v35.py" --root "$RUNNER_TEMP/v37"
          python "$R/base_character_v36/src/sprite_contract.py" bootstrap --root "$RUNNER_TEMP/v37" > "$RUNNER_TEMP/bootstrap2.json"
          python "$R/base_character_v36/src/sprite_contract.py" audit --root "$RUNNER_TEMP/v37" --output "$RUNNER_TEMP/v37/audit" > "$RUNNER_TEMP/audit2.json"
          python "$R/base_character_v37/src/qa_v37.py" \
            --root "$RUNNER_TEMP/v37" \
            --pack "$R/base_character_v37/assets/v37_skyguard_ember_84_layers.zip" \
            --receipts "$RUNNER_TEMP/v37-receipts/apply_receipts.json" \
            --report "$RUNNER_TEMP/v37/qa_v37.json"
          python "$R/base_character_v35/src/build_preview.py" --source "$RUNNER_TEMP/v37" --output "$RUNNER_TEMP/v37/preview.html"
      - name: Run twenty source + negative tests (includes 24 frozen RGBA hashes)
        env:
          BEAST_V37_OUTPUT: ${{ runner.temp }}/v37
          BEAST_V37_RECEIPTS: ${{ runner.temp }}/v37-receipts/apply_receipts.json
        run: |
          set -euo pipefail
          python -m unittest discover -s private-source/tools/pose_lock/base_character_v37/tests -p 'test_v37.py' -v
      - name: Install SHA256 pinned official LibreSprite v1.3
        run: bash pipeline/ci/setup_libresprite.sh
      - name: Strict native 23-layer 6-cel RGBA export for all four source skins
        run: |
          set -euo pipefail
          for skin in original skyguard ember hybrid; do
            libresprite -b --sheet-type horizontal "$RUNNER_TEMP/v37/skins/$skin/$skin.aseprite" --sheet "$RUNNER_TEMP/v37-$skin.png"
          done
          python - <<'PY'
          import os
          from pathlib import Path
          from PIL import Image
          root=Path(os.environ["RUNNER_TEMP"])
          for skin in ("original","skyguard","ember","hybrid"):
              native=Image.open(root/f"v37-{skin}.png").convert("RGBA")
              assert native.size==(480,80),f"Native 23-layer sprite size changed: {skin}"
              for i in range(1,7):
                  expected=Image.open(root/"v37"/"skins"/skin/f"run_{i:02}.png").convert("RGBA")
                  assert native.crop(((i-1)*80,0,i*80,80)).tobytes()==expected.tobytes(),f"RGBA_DIFF:{skin}:{i}"
              print(f"V37_LIBRESPRITE_{skin.upper()}_23_LAYER_RGBA_PASS")
          print("V37_ALL_4_NATIVE_SOURCE_EXPORTS_PASS")
          PY
      - name: Install Godot 4.7.2
        run: bash pipeline/ci/setup_godot.sh
      - name: Isolated Godot source-only load for 24 authored cels
        env:
          BEAST_V35_ART_DIR: ${{ runner.temp }}/v37
        run: |
          set -euo pipefail
          GODOT_LOG="$RUNNER_TEMP/v37-godot.log"
          godot --headless --path private-source/tools/pose_lock/base_character_v35/godot_source_review --script res://check_source.gd > "$GODOT_LOG" 2>&1 || { cat "$GODOT_LOG";exit 1; }
          cat "$GODOT_LOG"
          if grep -Eq 'ERROR:|SCRIPT ERROR:|Parser Error' "$GODOT_LOG"; then echo "::error::Godot engine error detected";exit 1;fi
          grep -q 'V35_GODOT_4_7_2_SOURCE_ONLY_PASS_24_CELS' "$GODOT_LOG"
      - name: Public CI scope and art-block evidence
        run: |
          {
            echo '### Base Character v3.7 real 84-layer authored source QA'
            echo '84 independently hashed art layers, 20 tests, 24 frozen RGBA hashes, LibreSprite exact native 4x6x23 layers and isolated Godot.'
            echo 'Owner visual status PENDING; hidden anatomy and motion seam not production approved.'
            echo 'NO game integration, NO Pages/Web E2E, NO public art artifacts, NO auto-merge/deploy.'
          } >> "$GITHUB_STEP_SUMMARY"
