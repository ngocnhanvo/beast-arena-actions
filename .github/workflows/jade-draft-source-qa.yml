name: Beast Arena - Isolated Jade Draft Source QA
# Deliberate push to a dedicated, trusted CI branch only; never a PR event.
# No exports, artifacts, release, Pages, or production workflow chaining.
on:
  push:
    branches: [ci/jade-pr2-source-check]
    paths:
      - ".github/workflows/jade-draft-source-qa.yml"
      - "ci/jade_draft_source_qa.py"
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: beast-jade-draft-source-qa
  cancel-in-progress: false

env:
  PRIVATE_SOURCE_SHA: "88f74b99ad1064083a205c94dc1ee8bdbfc80273"

jobs:
  source-art:
    name: Python and pinned LibreSprite source fidelity
    if: github.ref == 'refs/heads/ci/jade-pr2-source-check'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout exact trusted PRIVATE source commit (read only)
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/beast-arena
          ref: ${{ env.PRIVATE_SOURCE_SHA }}
          token: ${{ secrets.BEAST_ARENA_READ_TOKEN }}
          persist-credentials: false
          path: private-game
          fetch-depth: 1
      - name: Assert immutable source SHA
        id: pin
        run: |
          test "$(git -C private-game rev-parse HEAD)" = "$PRIVATE_SOURCE_SHA"
          echo "SOURCE_SHA=$PRIVATE_SOURCE_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned test-only Pillow
        run: python -m pip install "Pillow==11.3.0"
      - name: Run independent Python verifier from reviewed SHA
        id: verify
        run: python ci/jade_draft_source_qa.py verify private-game
      - name: Install existing pinned LibreSprite 1.3
        if: success() || (failure() && steps.pin.outcome == 'success')
        id: libre
        run: bash ci/setup_libresprite.sh
      - name: Run existing registered draft CLI tests and strict RGBA roundtrip
        if: always() && steps.libre.outcome == 'success'
        run: python ci/jade_draft_source_qa.py libresprite private-game
  native-godot:
    name: Godot 4.7.2 headless import and Jade smoke
    if: github.ref == 'refs/heads/ci/jade-pr2-source-check'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout exact trusted PRIVATE source commit (read only)
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/beast-arena
          ref: ${{ env.PRIVATE_SOURCE_SHA }}
          token: ${{ secrets.BEAST_ARENA_READ_TOKEN }}
          persist-credentials: false
          path: private-game
          fetch-depth: 1
      - name: Assert immutable source SHA
        run: |
          test "$(git -C private-game rev-parse HEAD)" = "$PRIVATE_SOURCE_SHA"
          echo "SOURCE_SHA=$PRIVATE_SOURCE_SHA"
      - name: Reuse existing Godot installer
        run: bash ci/setup_godot.sh
      - name: Headless Physics V2 import and source smoke (no export)
        run: python3 ci/jade_draft_source_qa.py godot private-game
  gif-playback:
    name: Chromium local GIF playback (no game or public artifact)
    if: github.ref == 'refs/heads/ci/jade-pr2-source-check'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout exact trusted PRIVATE source commit (read only)
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/beast-arena
          ref: ${{ env.PRIVATE_SOURCE_SHA }}
          token: ${{ secrets.BEAST_ARENA_READ_TOKEN }}
          persist-credentials: false
          path: private-game
          fetch-depth: 1
      - name: Assert immutable source SHA
        run: |
          test "$(git -C private-game rev-parse HEAD)" = "$PRIVATE_SOURCE_SHA"
          echo "SOURCE_SHA=$PRIVATE_SOURCE_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test-only browser
        run: |
          python -m pip install "playwright==1.56.0" "Pillow==11.3.0"
          python -m playwright install --with-deps chromium
      - name: Sample actual decoded GIF frames at playback cadence
        run: python ci/jade_draft_source_qa.py playback private-game
