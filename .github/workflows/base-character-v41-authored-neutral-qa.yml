name: Beast Arena - Base v4.1 original contours native source QA

on:
  push:
    branches: [ci/base-character-v41-authored-neutral-qa]
    paths: [".github/workflows/base-character-v41-authored-neutral-qa.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beast-v41-original-neutral-qa
  cancel-in-progress: false

jobs:
  original-neutral:
    name: Sixteen adversarial tests + 31-layer LibreSprite + isolated Godot
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout public test utilities, no game pixels
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: pipeline
      - name: Checkout EXACT private v4.1 authored code transiently
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/beast-arena
          ref: 1afe499ae67691bd850d9de4352f078e50810b1e
          token: ${{ secrets.BEAST_ARENA_READ_TOKEN }}
          persist-credentials: false
          path: private
      - name: Assert exact source pin and six original contour data
        run: |
          set -euo pipefail
          test "$(git -C private rev-parse HEAD)" = "1afe499ae67691bd850d9de4352f078e50810b1e"
          test -f private/tools/pose_lock/base_character_v41/data/pose_shapes.json
          test -f private/tools/pose_lock/base_character_v41/src/authored_neutral.py
          test -f private/tools/pose_lock/base_character_v40/src/native_ase.py
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow only
        run: python -m pip install --disable-pip-version-check "Pillow==11.3.0"
      - name: Sixteen source and one-part-edit adversarial tests
        run: |
          set -euo pipefail
          python -m unittest discover -s private/tools/pose_lock/base_character_v41/tests -v
      - name: Generate six authored poses in private temp only
        run: |
          set -euo pipefail
          python private/tools/pose_lock/base_character_v41/src/authored_neutral.py init --root "$RUNNER_TEMP/v41"
          python private/tools/pose_lock/base_character_v41/src/authored_neutral.py audit --root "$RUNNER_TEMP/v41"
          test -f "$RUNNER_TEMP/v41/render/neutral/contact.png"
      - name: Install shared Sprite Foundation independent validator
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-deps -e pipeline/packages/sprite-foundation
      - name: Inspect actual editable v4.1 source with release BLOCKED
        run: |
          set -euo pipefail
          python private/tools/pose_lock/base_character_v41/source_quality_adapter.py --root "$RUNNER_TEMP/v41" --out "$RUNNER_TEMP/v41/portable-manifest.json"
          set +e
          python -m sprite_foundation audit --manifest "$RUNNER_TEMP/v41/portable-manifest.json" --root "$RUNNER_TEMP/v41" --out "$RUNNER_TEMP/v41/portable-report.json"
          code=$?
          set -e
          test "$code" -eq 3
          python - <<'PY'
          from pathlib import Path
          import os,json
          doc=json.loads((Path(os.environ["RUNNER_TEMP"])/"v41"/"portable-report.json").read_text())
          assert doc["structure_status"]=="PASS",doc["structural_errors"]
          assert doc["release_status"]=="BLOCKED",doc["approval_blockers"]
          assert doc["visual_review_status"]=="REJECTED"
          assert {e["code"] for e in doc["approval_blockers"]}>={"GROUND_CONTACT_NOT_VERIFIED","LOOP_SEAM_NOT_REVIEWED","NO_EXTERNAL_OWNER_APPROVAL_FOR_EXACT_ART_BYTES"}
          assert "OWNER_REJECTED_ART" in {e["code"] for e in doc["approval_blockers"]}
          print("V41_PORTABLE_SOURCE_PASS_VISUAL_REJECTED_RELEASE_BLOCKED")
          PY
      - name: Checkout pinned public cross-project motion diagnostics
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/beast-arena-actions
          ref: 31991e608ed58f93341d215d3ad515b712ae1a73
          persist-credentials: false
          path: shared-foundation
      - name: Analyze actual v4.1 frame cadence without fake foot-contact approval
        run: |
          set -euo pipefail
          test "$(git -C shared-foundation rev-parse HEAD)" = "31991e608ed58f93341d215d3ad515b712ae1a73"
          python -m pip install --disable-pip-version-check --no-deps -e shared-foundation/packages/sprite-foundation
          python -m sprite_foundation motion-diagnose --manifest "$RUNNER_TEMP/v41/portable-manifest.json" --root "$RUNNER_TEMP/v41" --out "$RUNNER_TEMP/v41/motion-report.json"
          python - <<'PY'
          import os, json
          from pathlib import Path
          report=json.loads((Path(os.environ["RUNNER_TEMP"])/"v41/motion-report.json").read_text())
          assert report["frame_count"]==6
          assert len(report["transitions"])==6
          assert report["transitions"][-1]["loop_seam"]
          assert report["transitions"][-1]["to_frame"]==1
          assert report["ground_contact_status"]=="UNVERIFIED"
          assert report["world_space_foot_trajectory_status"]=="UNVERIFIED"
          assert report["loop_art_review_status"]=="UNVERIFIED"
          assert report["release_authorization"]=="NONE"
          print("V41_MOTION_DIAGNOSTIC_MEASURED_UNAPPROVED",
                "seam_ratio",report["seam_vs_internal_median_ratio"],
                "bottom_rows",[x["bottom_opaque_y"] for x in report["frames"]])
          PY
      - name: Install official pinned LibreSprite
        run: bash pipeline/ci/setup_libresprite.sh
      - name: Independent native ASE editor RGBA test
        run: |
          set -euo pipefail
          libresprite -b --sheet-type horizontal "$RUNNER_TEMP/v41/render/neutral/base_v41_31_layers.aseprite" --sheet "$RUNNER_TEMP/v41-native.png"
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import os
          root=Path(os.environ["RUNNER_TEMP"])
          native=Image.open(root/"v41-native.png").convert("RGBA")
          target=Image.open(root/"v41"/"render"/"neutral"/"run_right.png").convert("RGBA")
          assert native.size==target.size==(480,80)
          assert native.tobytes()==target.tobytes(),"LIBRESPRITE_NATIVE_RGBA_MISMATCH"
          print("V41_AUTHORED_6FRAME_31LAYER_LIBRESPRITE_PASS")
          PY
      - name: Install Godot 4.7.2
        run: bash pipeline/ci/setup_godot.sh
      - name: Native Godot isolated frame and atlas import
        env:
          BEAST_V40_ART_DIR: ${{ runner.temp }}/v41
        run: |
          set -euo pipefail
          REVIEW=private/tools/pose_lock/base_character_v40/godot_source_review
          godot --headless --path "$REVIEW" --script res://check_source.gd > "$RUNNER_TEMP/v41-godot.log" 2>&1 || { cat "$RUNNER_TEMP/v41-godot.log";exit 1; }
          if grep -Eq 'ERROR:|SCRIPT ERROR:|Parser Error' "$RUNNER_TEMP/v41-godot.log"; then cat "$RUNNER_TEMP/v41-godot.log";exit 1;fi
          grep -q 'V40_GODOT_4_7_2_NEUTRAL_SOURCE_PASS_6_CELS' "$RUNNER_TEMP/v41-godot.log"
          echo "V41_SOURCE_INDEPENDENT_GODOT_IMPORT_PASS"
      - name: Record correct partial art gate
        run: |
          {
            echo '### Base v4.1 original neutral body - source-only checks'
            echo '6 individually authored outlines, 17 editable body parts, 14 empty gear slots, 31-layer native file.'
            echo 'Self-review of V4.1 screenshot FAIL: anatomy/pose quality rejected, foot contact/loop unverified; source technical PASS does NOT certify art.'
            echo 'No private art uploaded, no Pages, no source merge, no live game build.'
          } >> "$GITHUB_STEP_SUMMARY"
