name: Beast Arena - Browser Playwright E2E

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Beast Arena - Godot CI (public runner)"]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  # Never continue checking an older Pages PCK after a newer successful
  # pipeline replaces it. Superseded browser runs are cancelled, not PASS.
  group: beast-arena-browser-e2e
  cancel-in-progress: true

jobs:
  publication-gate:
    # A successful scheduled build can reuse its source/Pages SHA cache.
    # In that case no NEW Web PCK was deployed and E2E must be SKIPPED,
    # not incorrectly compared to the schedule's fresh run ID.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      deployed: ${{ steps.check-pages.outputs.deployed }}
    steps:
      - name: Require actual upstream Pages deployment
        id: check-pages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
          REPOSITORY: ${{ github.repository }}
          DIRECT_MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          if [[ "$DIRECT_MANUAL" == "true" ]]; then
            echo "deployed=true" >> "$GITHUB_OUTPUT"
            echo "Manual browser recheck against current published Pages."
            exit 0
          fi
          # GitHub Actions jobs endpoint is ground truth (not overall run
          # conclusion). An hourly SHA-cache hit skips the deploy-pages job.
          RESULT="$(gh api "repos/$REPOSITORY/actions/runs/$UPSTREAM_RUN_ID/jobs?per_page=100" \
            --jq '.jobs[] | select(.name == "Publish Web game to GitHub Pages (PUBLIC)") | .conclusion')"
          case "$RESULT" in
            success)
              echo "deployed=true" >> "$GITHUB_OUTPUT"
              echo "Pages deployed by triggering run $UPSTREAM_RUN_ID; run strict exact-SHA and run-ID Chromium tests."
              ;;
            skipped)
              echo "deployed=false" >> "$GITHUB_OUTPUT"
              echo "::notice::Upstream run $UPSTREAM_RUN_ID reused successful source/Pages cache. No new deploy; browser tests are intentionally SKIPPED."
              echo "Browser checks skipped: upstream Pages job was skipped (unchanged deployed SHA)." >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "::error::Cannot verify upstream Pages deployment for run $UPSTREAM_RUN_ID (job conclusion: $RESULT)."
              exit 1
              ;;
          esac

  browser-smoke:
    needs: publication-gate
    if: needs.publication-gate.outputs.deployed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # E2E must use the test script from the SAME pipeline code commit
          # that produced the Web PCK. Otherwise rapid pushes race mismatched
          # tests against stale Pages deployments.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          python -m pip install "playwright==1.56.0" "Pillow==11.3.0"
          python -m playwright install --with-deps chromium
      - name: Test live Godot game with Chromium (scheduled full suite)
        if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.event != 'push'
        run: python ci/playwright_smoke.py
      - name: Test Base-only 12-cel idle, real combat and physics (scheduled full suite)
        if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.event != 'push'
        env:
          BEAST_EXPECT_PIPELINE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
          BEAST_EXPECT_BUILD_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || '' }}
        run: python ci/playwright_base_only.py
      - name: Verify owner canonical URL with no query and immediate G input
        run: python ci/playwright_canonical_controls.py
      - name: Save public screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beast-arena-browser-screenshots
          path: playwright-report/
          retention-days: 7
          if-no-files-found: warn
