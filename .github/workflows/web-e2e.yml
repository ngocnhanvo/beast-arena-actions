name: Beast Arena - Browser Playwright E2E

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Beast Arena - Godot CI (public runner)"]
    types: [completed]

permissions:
  contents: read

jobs:
  browser-smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # E2E must use the test script from the SAME pipeline code commit
          # that produced the Web PCK. Otherwise rapid pushes race mismatched
          # tests against stale Pages deployments.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          python -m pip install "playwright==1.56.0" "Pillow==11.3.0"
          python -m playwright install --with-deps chromium
      - name: Test live Godot game with Chromium
        run: python ci/playwright_smoke.py
      - name: Test isolated Godot Physics V2 Web scene with Chromium
        env:
          BEAST_EXPECT_PIPELINE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
          BEAST_EXPECT_BUILD_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || '' }}
        run: python ci/playwright_physics_v2.py
      - name: Save public screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beast-arena-browser-screenshots
          path: playwright-report/
          retention-days: 7
          if-no-files-found: warn
