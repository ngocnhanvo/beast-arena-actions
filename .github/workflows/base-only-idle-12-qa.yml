name: Beast Arena - Base Only 12-Frame Idle Integration QA

on:
  push:
    branches: [ci/base-only-idle-12-cutover]
    paths: [".github/workflows/base-only-idle-12-qa.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beast-base-only-idle-12-qa
  cancel-in-progress: false

jobs:
  private-source-godot:
    name: Exact source native Godot 4.7.2 integration (no Pages)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: pipeline
      - name: Checkout only the exact PRIVATE approved Base-only draft
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/beast-arena
          ref: 212db7a92e82427cab9a1ba75c29bef023bb1c13
          token: ${{ secrets.BEAST_ARENA_READ_TOKEN }}
          persist-credentials: false
          path: private
      - name: Verify source pin and no old fighters in active scene
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C private rev-parse HEAD)" = "212db7a92e82427cab9a1ba75c29bef023bb1c13"
          test -s private/experiments/physics_v2/art/base/base_idle_12_80.png
          test -s private/art/source/base_idle_12_hd.aseprite
          python - <<'PY'
          from pathlib import Path
          s=Path("private/experiments/physics_v2/scripts/demo.gd").read_text()
          assert s.count('&"base_human"')==4
          assert 'ALLY_ATLAS' not in s and 'RIVAL_A_ATLAS' not in s
          assert 'JADE_SCARF_ATLAS' not in s and 'PLAYER_ATLAS' not in s
          print("BASE_ONLY_ALL_FOUR_ACTIVE_FIGHTERS_PASS")
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check original cel anatomy/foot anchors without publishing pixels
        run: |
          python -m pip install --disable-pip-version-check "Pillow==11.3.0"
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          source=Path("private/experiments/physics_v2/art/base/base_idle_12_80.png")
          atlas=Image.open(source).convert("RGBA")
          assert atlas.size==(960,80),atlas.size
          frames=[atlas.crop((i*80,0,(i+1)*80,80)) for i in range(12)]
          bounds=[frame.getchannel("A").getbbox() for frame in frames]
          assert all((r[0],r[2],r[3])==(16,64,76) for r in bounds),bounds
          foots=[frame.crop((0,67,80,80)).getchannel("A").getbbox() for frame in frames]
          assert len(set(foots))==1,foots
          assert len(set(f.tobytes() for f in frames))>=6
          print("BASE_IDLE_SOURCE_12_DIFFERENT_CELS_FOOT_BOUND_LOCK_PASS")
          PY
      - name: Install exact Godot engine
        run: bash pipeline/ci/setup_godot.sh
      - name: Headless import + fail on script parser errors
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --editor --path private/experiments/physics_v2 --import --quit 2>&1 | tee /tmp/base-import.log
          if grep -E 'SCRIPT ERROR:|ERROR: Failed to load script|Parser Error:' /tmp/base-import.log; then exit 1; fi
          echo "BASE_ONLY_GODOT_IMPORT_PASS"
      - name: Actual 4-slot Base-only scene instantiation and atlas smoke
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path private/experiments/physics_v2 --script res://tests/base_only_idle_12_smoke.gd 2>&1 | tee /tmp/base-smoke.log
          grep -q "BASE_ONLY_IDLE_12_SOURCE_BINDING_PASS" /tmp/base-smoke.log
      - name: Physics 60Hz and combat data regression
        shell: bash
        run: |
          set -euo pipefail
          cd private/experiments/physics_v2
          for test in physics_smoke.gd combat_v2_test.gd; do
            godot --headless --path . --script "res://tests/$test" 2>&1 | tee "/tmp/base-$test.log"
            if grep -E 'SCRIPT ERROR:|Parser Error:' "/tmp/base-$test.log"; then exit 1; fi
          done
          echo "BASE_ONLY_PHYSICS_COMBAT_TESTS_PASS"
      - name: Existing physics, map, match and visual regressions
        shell: bash
        run: |
          set -euo pipefail
          cd private/experiments/physics_v2
          for test in arcade_animation_v2_smoke.gd guard_animation_profiles_smoke.gd three_quarter_preview_smoke.gd map_editor_smoke.gd visual_smoke.gd pixel_projection_smoke.gd combat_scene_smoke.gd hit_effects_smoke.gd match_state_smoke.gd match_scene_smoke.gd obstacle_collision_smoke.gd; do
            echo "TEST_START $test"
            godot --headless --path . --script "res://tests/$test" 2>&1 | tee "/tmp/base-regression-$test.log"
            if grep -E 'SCRIPT ERROR:|Parser Error:' "/tmp/base-regression-$test.log"; then exit 1; fi
            echo "TEST_PASS $test"
          done
          echo "BASE_ONLY_LEGACY_REGRESSIONS_PASS"
      - name: No public art / no game deploy declaration
        shell: bash
        run: |
          echo "PRIVATE source exact SHA: 212db7a92e82427cab9a1ba75c29bef023bb1c13" >> "$GITHUB_STEP_SUMMARY"
          echo "Only source/CI checks; no public binary, no Pages, no Chromium E2E." >> "$GITHUB_STEP_SUMMARY"
          echo "Idle 12 authored; other motion graphics still PENDING_ART." >> "$GITHUB_STEP_SUMMARY"
