[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sprite-foundation"
version = "0.1.0"
description = "Game-independent, fail-closed topology and owner-art acceptance contracts for layered 2D sprites"
requires-python = ">=3.10"
dependencies = ["Pillow>=10.0,<13"]
license = {text = "MIT"}

[project.scripts]
sprite-foundation = "sprite_foundation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]